name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Verify generated API documents
        run: make openapi-check
