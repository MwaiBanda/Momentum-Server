services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: momentum_test
      POSTGRES_USER: momentum_test
      POSTGRES_PASSWORD: momentum_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum_test -d momentum_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
