services:
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    environment:
      PROMETHEUS_BEARER_TOKEN: ${PROMETHEUS_BEARER_TOKEN:?export PROMETHEUS_BEARER_TOKEN before starting the stack}
      PROMETHEUS_API_TARGET: ${PROMETHEUS_API_TARGET:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
