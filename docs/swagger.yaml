host: services.momentumchurch.dev
info:
  contact:
    email: bandamwai@gmail.com
    name: Mwai Banda
  description: This is a backend service to process payments and provide some CRUD
    functionality
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://momentumindiana.org/statement-of-faith/
  title: Momentum API
  version: v1
paths:
  /api/v1/events:
    get:
      consumes:
      - application/json
      description: Get all events scheduled on the church calendar
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get all calendar events
      tags:
      - Events
  /api/v1/meals:
    get:
      consumes:
      - application/json
      description: Get all meals and their volunteer assignments
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/meal.Response'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get all meals
      tags:
      - Meals
    post:
      consumes:
      - application/json
      description: Create a meal and its requested volunteer dates
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Post a meal
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/meal.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/meal.Input'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Post a meal
      tags:
      - Meals
    put:
      consumes:
      - application/json
      description: Update a meal
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Update a meal
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/meal.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/meal.Input'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Update a meal
      tags:
      - Meals
  /api/v1/meals/{mealId}:
    delete:
      consumes:
      - application/json
      description: Delete a meal by ID
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: provide meal ID
        in: path
        name: mealId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/meal.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Delete a meal
      tags:
      - Meals
  /api/v1/meals/meal:
    post:
      consumes:
      - application/json
      description: Update a volunteered meal and assign its volunteer
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Assign a volunteer
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/meal.VolunteerAssignmentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/meal.VolunteerAssignmentInput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Assign a volunteer to a meal
      tags:
      - Meals
    put:
      consumes:
      - application/json
      description: Update a volunteered meal's description and notes
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Update a volunteered meal
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/meal.UpdateVolunteeredMealInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/meal.UpdateVolunteeredMealInput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Update a volunteered meal
      tags:
      - Meals
  /api/v1/messages:
    post:
      consumes:
      - application/json
      description: Used to post a message
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Post a message
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/message.MessageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Post a Message
      tags:
      - Messages
    put:
      consumes:
      - application/json
      description: Used to update a message
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Update a message
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/message.MessageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Update a Message
      tags:
      - Messages
  /api/v1/messages/{messageId}:
    delete:
      consumes:
      - application/json
      description: Delete a message and its passages and notes
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: provide message Id
        in: path
        name: messageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Delete message information
      tags:
      - Messages
  /api/v1/messages/{userId}:
    get:
      consumes:
      - application/json
      description: get published messages and that user's passage notes
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: provide user Id
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.MessageListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Show published messages available for a user
      tags:
      - Messages
  /api/v1/messages/admin:
    get:
      consumes:
      - application/json
      description: get published messages without user-specific passage notes
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/message.MessageListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Show all published messages for the CMS
      tags:
      - Messages
  /api/v1/messages/notes:
    post:
      consumes:
      - application/json
      description: Used to add user notes to a passage
      parameters:
      - description: Provide a bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Post a note
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/message.CreateNoteInput'
      produces:
